name: Update profile art

# Refreshes every data-driven SVG daily from real, public GitHub data.
# Static art (ASCII portrait, info card, tagline banner) is NOT regenerated
# here -- only re-run those scripts by hand when your photo/bio changes.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: adi45726
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Fetch real per-language byte counts
        run: python scripts/fetch_languages.py

      - name: Render languages bar SVG
        run: python scripts/render_languages_svg.py

      - name: Fetch recent public activity
        run: python scripts/fetch_recent_activity.py

      - name: Render activity ticker SVG
        run: python scripts/render_activity_svg.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: adi45726
          outputs: |
            snake.svg?palette=github-dark&color_snake=%2322d3ee&color_background=%230d1117&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json contrib-heatmap.svg
            data/languages.json languages.svg
            data/recent_activity.json activity-ticker.svg
            snake.svg
